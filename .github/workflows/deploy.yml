# Secrela Web — build on GitHub, then deploy to VPS over SSH.
# Secrets (repo Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
# SSH port is 22 (do not put VPS_PORT in secrets — appleboy requires a real integer).
#
# Server must have frontend/.env.production with NEXT_PUBLIC_API_URL before build.
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.secrela.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build (CI smoke)
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH — pull, build, restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/var/www/secrela/secrela-frontend"
            PM2="sudo -u deploy -H pm2"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing $APP_DIR — clone secrela-frontend on the server first."
              exit 1
            fi
            if [ ! -f "$APP_DIR/.env.production" ]; then
              echo "Missing $APP_DIR/.env.production (needs NEXT_PUBLIC_API_URL)."
              exit 1
            fi
            cd "$APP_DIR"
            sudo -u deploy git fetch origin main
            sudo -u deploy git reset --hard origin/main
            sudo -u deploy npm ci
            sudo -u deploy npm run build
            if $PM2 describe secrela-frontend >/dev/null 2>&1; then
              $PM2 restart secrela-frontend --update-env
            else
              $PM2 start npm --name secrela-frontend -- start -- -H 127.0.0.1 -p 3010
            fi
            $PM2 save
            echo "Web deploy complete."
