# Secrela Web — build on GitHub, then deploy to VPS over SSH.
# Secrets (repo Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  (+ optional VPS_PORT)
#
# Server must have frontend/.env.production with NEXT_PUBLIC_API_URL before build.
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.secrela.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build (CI smoke)
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH — pull, build, restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/var/www/secrela-web"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing $APP_DIR — run server setup first (clone secrela-frontend)."
              exit 1
            fi
            if [ ! -f "$APP_DIR/.env.production" ]; then
              echo "Missing $APP_DIR/.env.production (needs NEXT_PUBLIC_API_URL)."
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            if pm2 describe secrela-web >/dev/null 2>&1; then
              pm2 restart secrela-web --update-env
            else
              pm2 start npm --name secrela-web -- start
            fi
            pm2 save
            echo "Web deploy complete."
